<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JamSync — Party Room</title>
  <meta name="description" content="JamSync party room — see who's in, invite friends, start together." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="party.css" />
</head>
<body>

  <!-- Animated background -->
  <div class="bg-wrapper">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="bars-bg">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
  </div>

  <!-- ── TOP BAR ── -->
  <nav class="navbar">
    <div class="nav-left">
      <button class="back-btn" onclick="leaveAndBack()" title="Leave party and go back">←</button>
      <div class="nav-logo">
        <div class="logo-icon">🎉</div>
        <span class="logo-text">Party Room</span>
      </div>
    </div>
    <div class="nav-center">
      <span class="nav-tagline" id="party-status">🟢 Waiting for the crew…</span>
    </div>
    <div class="nav-right">
      <span class="me-chip"><span class="avatar" id="me-avatar">M</span><span id="me-name">Musician</span></span>
    </div>
  </nav>

  <!-- ── PARTY LAYOUT ── -->
  <main class="main wide">
   <div class="dash-layout">
    <div class="dash-main">

      <!-- Who is in the party -->
      <section class="party-box">
        <div class="party-box-header">
          <h2>🎶 Who's in the party <span class="member-count" id="member-count"></span></h2>
        </div>
        <div class="members-grid" id="members-grid">
          <p class="pane-hint">Joining… 🎉</p>
        </div>
      </section>

      <!-- Start + Leave -->
      <section class="party-actions">
        <button class="start-btn" id="start-btn" onclick="startParty()">▶ START</button>
        <button class="leave-btn" onclick="leaveAndBack()">🚪 Leave Party</button>
      </section>
      <p class="bottom-hint">💡 Anyone in the party can press START • Back also leaves the party</p>

    </div>

    <!-- Right vertical friends rail with invite buttons -->
    <aside class="friends-rail">
      <div class="rail-title">👥<span id="rail-count"></span></div>
      <div class="rail-list" id="rail-list">
        <p class="rail-empty">No friends yet</p>
      </div>
    </aside>
   </div>
  </main>

  <!-- Party Invite Popup -->
  <div class="modal-overlay hidden" id="invite-modal">
    <div class="invite-box">
      <div class="invite-avatar" id="invite-avatar">?</div>
      <p class="invite-text" id="invite-text">Your friend invited you to the party!</p>
      <div class="invite-timer-bar"><div class="invite-timer-fill" id="invite-timer-fill"></div></div>
      <p class="invite-count" id="invite-count">10s</p>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="declineInvite()">Decline</button>
        <button class="btn-confirm invite-join" onclick="acceptInvite()">Join 🎉</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast">
    <span class="toast-icon">🎉</span>
    <span class="toast-msg" id="toast-msg"></span>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="party.js"></script>
</body>
</html>
